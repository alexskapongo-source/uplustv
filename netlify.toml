# ============================================================
#  Deploiement Netlify — Univers+
# ------------------------------------------------------------
#  Le site n'est pas un export statique : middleware de langue,
#  routes API, espace d'administration et rendu a la demande.
#  Le runtime Next.js de Netlify est donc indispensable.
# ============================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ------------------------------------------------------------
#  En-tetes de securite
#  Completent ceux definis dans next.config.ts et couvrent aussi
#  les fichiers statiques servis directement par le CDN.
# ------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Visuels et logos sont versionnes par leur nom de fichier :
# ils peuvent etre mis en cache indefiniment.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ------------------------------------------------------------
#  Les deploiements de previsualisation ne doivent jamais etre
#  indexes : ils dupliqueraient le site de production.
# ------------------------------------------------------------

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"
